const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dpr=Math.min(2,devicePixelRatio||1);
const W=innerWidth,H=innerHeight;
cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
const rnd=(a,b)=>a+Math.random()*(b-a);
const back=t=>{const c=1.4;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
let imgs=[],loaded=0;
SRC.forEach((s,i)=>{const im=new Image();im.onload=()=>{if(++loaded===SRC.length)start()};im.src=s;imgs[i]=im});
function start(){
 imgs.forEach(im=>{const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.drawImage(im,0,0,16,16);const d=x.getImageData(0,0,16,16).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=4)if(d[i+3]>200){r+=d[i];g+=d[i+1];b+=d[i+2];n++}n=n||1;im.col=[r/n|0,g/n|0,b/n|0]});
 const s0=Math.max(110,Math.min(220,Math.min(W,H)/4)),step=s0*.55,cx=W/2,cy=H/2;
 const maxD=Math.hypot(W,H)/2,fl=[];
 for(let y=-step;y<=H+step;y+=step)for(let x=-step;x<=W+step;x+=step){
  const px=x+rnd(-step/2,step/2),py=y+rnd(-step/2,step/2),d=Math.hypot(px-cx,py-cy);
  fl.push({x:px,y:py,s:s0*rnd(1,1.7),r:rnd(0,6.28),im:imgs[Math.random()*imgs.length|0],
   gd:d/maxD*1000+rnd(0,350),vy:0,vx:0,vr:0,fy:0,fall:false,sp:rnd(.5,1.4)*(Math.random()<.5?-1:1),ph:rnd(0,6.28)})}
 fl.push({x:cx,y:cy,s:s0*1.4,r:0,im:imgs[Math.random()*imgs.length|0],gd:0,vy:0,vx:0,vr:0,fy:0,fall:false,sp:.8,ph:0});
 fl.sort((a,b)=>a.gd-b.gd);
 let acc=500;fl.forEach((f,i)=>{f.gd=acc;acc+=170-120*(i/fl.length)});
 fl.forEach(f=>{f.fd=(H-f.y)/H*900+rnd(0,250)});
 const GROW=900,HOLD=acc+GROW+3500;
 let t0=performance.now(),last=t0;
 window.setTimeout(()=>document.body.classList.add('bloom-background-visible'),1100);
 (function loop(now){
  const t=now-t0,dt=Math.min(.05,(now-last)/1000);last=now;
  ctx.clearRect(0,0,W,H);let alive=0;
  for(const f of fl){
   let sc=1,rot=f.r;
   if(t>=HOLD+f.fd){ // falling
    if(!f.fall){f.fall=true;f.r+=f.sp*Math.max(0,(t-f.gd)/1000);f.vr=f.sp*2.5}
    f.vy+=1800*dt;f.y+=f.vy*dt;f.x+=f.vx*dt;f.r+=f.vr*dt;rot=f.r;
    if(f.y-f.s>H)continue;
   }else{
    const p=Math.min(1,Math.max(0,(t-f.gd)/GROW));
    if(p===0){alive++;continue}
    sc=back(p)*(1+.05*Math.sin(t/1000*2.4+f.ph));rot=f.r+(1-p)*-3+f.sp*Math.max(0,(t-f.gd)/1000);
   }
   alive++;
   const s=f.s*sc;ctx.save();ctx.translate(f.x,f.y);ctx.rotate(rot);
   const h=s*f.im.height/f.im.width,c=f.im.col;
   const g=ctx.createRadialGradient(0,0,s*.1,0,0,s*.62);g.addColorStop(0,`rgba(${c},.3)`);g.addColorStop(1,`rgba(${c},0)`);
   ctx.globalCompositeOperation='multiply';ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,s*.62,0,6.283);ctx.fill();
   ctx.globalCompositeOperation='source-over';ctx.shadowColor=`rgba(${c},.5)`;ctx.shadowBlur=s*.07;ctx.globalAlpha=.94;
   ctx.drawImage(f.im,-s/2,-h/2,s,h);ctx.restore();
  }
  if(alive>0)requestAnimationFrame(loop);else{ctx.clearRect(0,0,W,H);window.parent.postMessage({type:'flower-fall-finished'},'*')}
 })(t0);
